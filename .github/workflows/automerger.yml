name: Auto-update dev branch

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  update-branchs:
    if: github.event.pull_request.merged == true
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set Git config
      run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"
          git fetch --unshallow
    - name: Merge main back to dev
      id: dev
      continue-on-error: true
      run: |
          git checkout dev
          git pull
          git merge main --ff-only && git push || (echo "Unable to fast-forward dev" && exit 1)
    - name: Merge main back to dev-wrapper
      id: dev_wrapper
      continue-on-error: true
      run: |
          git checkout dev-wrapper
          git pull
          git merge main --ff-only && git push || (echo "Unable to fast-forward dev-wrapper" && exit 1)
    - name: Merge main back to dev-images
      id: dev_images
      continue-on-error: true
      run: |
          git checkout dev-images
          git pull
          git merge main --ff-only && git push || (echo "Unable to fast-forward dev-images" && exit 1)
    - name: Merge main back to dev-studio
      id: dev_studio
      continue-on-error: true
      run: |
          git checkout dev-studio
          git pull
          git merge main --ff-only && git push || (echo "Unable to fast-forward dev-studio" && exit 1)
    - name: Fail if a branch could not be fast-forwarded
      if: steps.dev.outcome == 'failure' || steps.dev_wrapper.outcome == 'failure' || steps.dev_images.outcome == 'failure' || steps.dev_studio.outcome == 'failure'
      run: exit 1
